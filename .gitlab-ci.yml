# shell-docs CI via the creatures catalog.

include:
  - component: $CI_SERVER_FQDN/ksoft/creatures/forge@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/linear@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/agents@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--ops-lint@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--lint@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--test@0.20.0-dev.10
    inputs:
      tests: test/*.bats

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The test reads the scanner, the lowering and the goldens driver from the
# trees the lock pins, which shellops fetches when it boots, so the test job
# needs no submodule beyond shell/.ops. The base job's before_script
# fetches bats-core under it.
#
# shellops' .envrc sources shell-logs from its own nested submodule, and the
# base job's first shellops command loads .envrc before it recurses. The
# stock image has no git, so the job installs git, fetches that one
# submodule, then runs the base before_script. shell-logs is public, so the
# fetch needs no token.
ksoft/shell/test:
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: shell/.ops
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends git ca-certificates > /dev/null
    - git -C shell/.ops submodule update --init --depth 1 shell/.logs
    - !reference [.shellops, before_script]
